<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Manager Users</h2>
                <p class="text-muted mb-0">Update roles and remove users from the system.</p>
            </div>
            <a href="/" class="btn btn-outline-secondary">Back to home</a>
        </div>

        <div th:if="${success}" class="alert alert-success" role="alert">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.username}"></td>
                            <td>
                                <form th:action="@{/admin/users/{id}/role(id=${user.userId})}" method="post"
                                    class="d-flex gap-2">
                                    <select name="role" class="form-select form-select-sm">
                                        <option value="USER" th:selected="${user.role == 'USER'}">User</option>
                                        <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">Admin</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-primary">Save</button>
                                </form>
                            </td>
                            <td>
                                <form th:action="@{/admin/users/{id}/toggle(id=${user.userId})}" method="post"
                                    class="d-flex align-items-center gap-2">
                                    <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-secondary'"
                                        th:text="${user.enabled ? 'Enabled' : 'Disabled'}"></span>
                                    <button type="submit" class="btn btn-sm btn-outline-primary">
                                        Toggle
                                    </button>
                                </form>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/admin/users/{id}/delete(id=${user.userId})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
