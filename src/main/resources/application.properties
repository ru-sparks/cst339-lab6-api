spring.application.name=lab2-api

# Lab 5 Branch 13: load uncommitted application-local.properties when present.
# Override with SPRING_PROFILES_ACTIVE if needed (for example, ci).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Hibernate SQL logging (stdout)
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate SQL logging (via logger)
logging.level.org.hibernate.SQL=DEBUG

# Bind parameters
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Result extraction (optional)
logging.level.org.hibernate.orm.jdbc.extract=TRACE

# Datasource defaults for local PostgreSQL. Override with environment variables
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)
# or with src/main/resources/application-local.properties (gitignored).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chinook}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true

server.port=${PORT:8080}
